name = "ksp-gives-back"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ── Custom Domains ──
# mnquietvalor.com is the primary domain; kspgivesback.com stays attached so the
# worker can 301 its traffic to mnquietvalor.com (see src/index.js host check).
routes = [
  { pattern = "mnquietvalor.com", custom_domain = true },
  { pattern = "www.mnquietvalor.com", custom_domain = true },
  { pattern = "kspgivesback.com", custom_domain = true },
]

# ── Static Assets ──
# run_worker_first so the domain redirect above applies to static pages too
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# ── Cloudflare D1 Database ──
[[d1_databases]]
binding = "DB"
database_name = "ksp-gives-back"
database_id = "78c96711-9328-4af9-8442-6a3fe8a94f11"

# ── Cloudflare KV Namespace ──
[[kv_namespaces]]
binding = "CACHE"
id = "cfb8f1d2232446028d80b177502a171d"

# ── Cloudflare R2 Bucket (Media Uploads) ──
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ksp-gives-back-media"
